# DSIML Ruff configuration: copy this file to the project root.
# The target Python version is read from `requires-python` in pyproject.toml.

[lint]
select = [
	"E",     # pycodestyle errors
	"W",     # pycodestyle warnings
	"F",     # pyflakes
	"I",     # import order
	"B",     # likely bugs
	"UP",    # syntax of the targeted Python version
	"SIM",   # simplifications
	"C4",    # comprehensions
	"N",     # naming
	"S",     # security
	"PT",    # pytest style
	"ASYNC", # blocking calls in async code
	"C90",   # complexity
	"RUF",   # Ruff-specific
]
# Line length is the formatter's job.
ignore = ["E501"]

# French typography in user-facing strings: apostrophe, no-break spaces.
allowed-confusables = ["\u2019", "\u00a0", "\u202f"]

[lint.mccabe]
# An app factory (FastAPI `create_app`) counts the branches of the route
# handlers it nests: declare routes on a module-level APIRouter instead.
max-complexity = 10

[lint.per-file-ignores]
# `assert` is how pytest checks; fake credentials are test data.
"tests/**" = ["S101", "S105", "S106"]
